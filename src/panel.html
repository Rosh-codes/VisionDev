<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VisionDev</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      padding: 12px;
      background: var(--vscode-editor-background);
      color: var(--vscode-editor-foreground);
      font-family: var(--vscode-font-family);
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .status-row { display: flex; align-items: center; gap: 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--vscode-disabledForeground); }
    .frame-wrap {
      border: 1px solid var(--vscode-panel-border);
      background: var(--vscode-sideBar-background);
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .frame-wrap.skeleton::after {
      content: "Waiting for browser...";
      color: var(--vscode-descriptionForeground);
      font-size: 11px;
    }
    img { max-width: 100%; max-height: 380px; display: block; }
    .section-title {
      color: var(--vscode-descriptionForeground);
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin: 0;
    }
    .log {
      border: 1px solid var(--vscode-panel-border);
      background: var(--vscode-textCodeBlock-background);
      max-height: 220px;
      overflow-y: auto;
      padding: 6px 8px;
      font-family: var(--vscode-editor-font-family, monospace);
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .log-entry { white-space: pre-wrap; word-break: break-word; }
    .log-entry.error { color: var(--vscode-errorForeground); }
    .log-entry.warn { color: var(--vscode-charts-yellow); }
    .report {
      display: none;
      border: 1px solid var(--vscode-panel-border);
      background: var(--vscode-textCodeBlock-background);
      padding: 8px;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: var(--vscode-editor-font-family, monospace);
      font-size: 11px;
      max-height: 240px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="status-row">
    <span id="status-dot" class="dot"></span>
    <span id="status-text">Ready</span>
  </div>

  <p class="section-title">Live frame</p>
  <div id="frame-wrap" class="frame-wrap skeleton"><img id="frame-img" alt="Live frame" /></div>

  <p class="section-title">Activity</p>
  <div id="log" class="log"></div>

  <p class="section-title">Last result</p>
  <pre id="report" class="report"></pre>

  <script>
    const statusDot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");
    const frameWrap = document.getElementById("frame-wrap");
    const frameImg = document.getElementById("frame-img");
    const logEl = document.getElementById("log");
    const report = document.getElementById("report");

    const MAX_LOG = 80;

    function setDot(colorVar) {
      statusDot.style.background = `var(${colorVar})`;
    }

    function appendLog(level, message) {
      const div = document.createElement("div");
      div.className = `log-entry ${level || "info"}`;
      const time = new Date().toLocaleTimeString();
      div.textContent = `${time}  ${message}`;
      logEl.appendChild(div);
      while (logEl.children.length > MAX_LOG) {
        logEl.removeChild(logEl.firstChild);
      }
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setFrame(base64) {
      if (!base64) {
        frameWrap.classList.add("skeleton");
        frameImg.removeAttribute("src");
        return;
      }
      frameWrap.classList.remove("skeleton");
      frameImg.src = `data:image/png;base64,${base64}`;
    }

    window.addEventListener("message", (event) => {
      const msg = event.data;
      if (!msg || !msg.type) return;

      if (msg.type === "log") {
        appendLog(msg.level, msg.message);
        return;
      }

      if (msg.type === "frame") {
        setFrame(msg.data);
        appendLog("info", `frame: ${msg.label} (${msg.viewport})`);
        return;
      }

      if (msg.type === "status") {
        if (msg.state === "running") {
          setDot("--vscode-charts-yellow");
          statusText.textContent = msg.url ? `Running on ${msg.url}` : "Running...";
          report.style.display = "none";
          report.textContent = "";
          appendLog("info", `start: ${msg.url || ""}`);
        } else if (msg.state === "done" && msg.result) {
          if (msg.result.status === "PASS") {
            setDot("--vscode-testing-iconPassed");
            statusText.textContent = `PASS`;
          } else {
            setDot("--vscode-testing-iconFailed");
            const why = msg.result.failureType || "fail";
            statusText.textContent = `FAIL — ${why}`;
          }
          appendLog(
            msg.result.status === "PASS" ? "info" : "error",
            `done: ${msg.result.status}${msg.result.errorMessage ? " — " + msg.result.errorMessage : ""}`
          );
          report.style.display = "block";
          report.textContent = JSON.stringify(msg.result, null, 2);
        } else {
          setDot("--vscode-disabledForeground");
          statusText.textContent = "Ready";
        }
      }
    });

    setDot("--vscode-disabledForeground");
    appendLog("info", "VisionDev panel ready. Waiting for CLI...");
  </script>
</body>
</html>
